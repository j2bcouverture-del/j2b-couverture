name: Protéger prestations par ville

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-prestations-villes.yml"

permissions:
  contents: read

jobs:
  verifier-page:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Vérifier que la page prestations par ville est protégée
        shell: python
        run: |
          from pathlib import Path

          page = Path("prestations-par-ville.html")

          if not page.exists():
              raise SystemExit(
                  "ERREUR : prestations-par-ville.html est introuvable. "
                  "Le workflow ne recrée volontairement pas la page afin "
                  "d'éviter d'écraser sa version personnalisée."
              )

          html = page.read_text(encoding="utf-8")

          verifications = {
              "prestation PVC": "habillage-rives-sous-face.html",
              "réalisation Gondreville": "Récemment réalisé à Gondreville",
              "bandeau téléphone global": "J2B CONTACT GLOBAL START",
              "numéro fixe": "03 72 76 00 60",
              "numéro portable": "06 01 46 26 12",
          }

          erreurs = []

          for nom, texte in verifications.items():
              if texte not in html:
                  erreurs.append(nom)

          if erreurs:
              raise SystemExit(
                  "ERREUR : éléments manquants dans prestations-par-ville.html : "
                  + ", ".join(erreurs)
              )

          if html.count("J2B CONTACT GLOBAL START") != 1:
              raise SystemExit(
                  "ERREUR : le bandeau téléphone global apparaît plusieurs fois."
              )

          print("OK : prestations-par-ville.html est présente et conforme.")
          print("Aucune modification automatique de la page n'est effectuée.")
