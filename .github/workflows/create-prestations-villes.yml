name: Créer prestations par ville

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-prestations-villes.yml"

permissions:
  contents: write

jobs:
  create-page:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Créer la page prestations par ville
        shell: python
        run: |
          from pathlib import Path

          cities = [
              ("Toul", "couvreur-toul.html"),
              ("Nancy", "couvreur-nancy.html"),
              ("Écrouves", "couvreur-ecrouves.html"),
              ("Dommartin-lès-Toul", "couvreur-dommartin-les-toul.html"),
              ("Gondreville", "couvreur-gondreville.html"),
              ("Liverdun", "couvreur-liverdun.html"),
          ]

          services = [
              ("🏠", "Rénovation de toiture", "renovation-toiture.html"),
              ("💧", "Réparation de fuite", "reparation-fuite-toiture.html"),
              ("🔧", "Zinguerie", "zinguerie.html"),
              ("🌧️", "Gouttières", "gouttieres.html"),
              ("🏠", "Faîtage et arêtiers", "faitage-arretiers.html"),
              ("🌿", "Démoussage de toiture", "demoussage-toiture.html"),
              ("✅", "Entretien de toiture", "entretien-toiture.html"),
              ("🛡️", "Isolation de toiture", "isolation-toiture.html"),
              ("🪚", "Traitement de charpente", "traitement-charpente.html"),
          ]

          cards = []

          for city, city_url in cities:

              links = []

              for icon, service, url in services:
                  links.append(
                      f'''
                      <a class="serviceLink" href="./{url}">
                        <span>{icon} {service} à {city}</span>
                        <strong>→</strong>
                      </a>
                      '''
                  )

              cards.append(
                  f'''
                  <article class="cityCard">
                    <div class="cityHead">
                      <span class="pin">📍</span>
                      <div>
                        <h2>{city}</h2>
                        <p>Travaux de couverture et toiture à {city}</p>
                      </div>
                    </div>

                    <div class="cityLinks">
                      {''.join(links)}
                    </div>

                    <a class="cityPage" href="./{city_url}">
                      Voir notre page couvreur à {city} →
                    </a>
                  </article>
                  '''
              )

          city_cards = "\n".join(cards)

          html = '''<!doctype html>
          <html lang="fr">

          <head>

            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">

            <title>Travaux de toiture par ville | Toul, Nancy et Toulois | J2B Couverture</title>

            <meta name="description"
                  content="Découvrez les prestations J2B Couverture à Toul, Nancy, Écrouves, Dommartin-lès-Toul, Gondreville et Liverdun : rénovation toiture, fuite, zinguerie, gouttières, faîtage, démoussage et entretien.">

            <meta name="robots"
                  content="index,follow,max-image-preview:large,max-snippet:-1">

            <link rel="canonical"
                  href="https://j2b-couverture.fr/prestations-par-ville.html">

            <meta name="theme-color" content="#182536">

            <script async
              src="https://www.googletagmanager.com/gtag/js?id=G-ZGCBS6FYZR">
            </script>

            <script>
              window.dataLayer=window.dataLayer||[];
              function gtag(){dataLayer.push(arguments);}
              gtag('js',new Date());
              gtag('config','G-ZGCBS6FYZR');
            </script>

            <style>

              :root{
                --navy:#182536;
                --navy2:#24364C;
                --gold:#C1A66B;
                --red:#B32025;
                --red2:#8D181C;
                --soft:#F7F5F1;
                --text:#1D2732;
                --muted:#66717C;
                --border:#E1E3E5;
                --shadow:0 14px 38px rgba(24,37,54,.10);
                --max:1160px;
              }

              *{
                box-sizing:border-box
              }

              body{
                margin:0;
                font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
                background:#fff;
                color:var(--text);
              }

              a{
                color:inherit;
                text-decoration:none
              }

              .container{
                width:min(var(--max),92%);
                margin:auto;
              }

              /* TÉLÉPHONES */

              .phones{
                background:var(--navy);
                border-bottom:3px solid var(--gold);
                padding:7px 0;
              }

              .phonesInner{
                width:min(var(--max),96%);
                margin:auto;
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:8px;
              }

              .phone{
                min-height:46px;
                display:flex;
                align-items:center;
                justify-content:center;
                border-radius:11px;
                font-weight:900;
              }

              .phoneFixe{
                background:var(--red);
                color:#fff;
              }

              .phonePortable{
                background:#fff;
                color:var(--navy);
              }

              /* LOGO */

              .logoBar{
                background:#fff;
                border-bottom:4px solid var(--gold);
                box-shadow:0 5px 18px rgba(24,37,54,.08);
              }

              .logoBar a{
                min-height:92px;
                display:flex;
                justify-content:center;
                align-items:center;
              }

              .logoBar img{
                width:auto;
                height:72px;
                max-width:220px;
                object-fit:contain;
              }

              /* HERO */

              .hero{
                background:
                  linear-gradient(135deg,var(--navy),var(--navy2));
                color:#fff;
                padding:62px 0;
              }

              .eyebrow{
                display:inline-flex;
                padding:8px 12px;
                border-radius:99px;
                background:rgba(193,166,107,.18);
                color:#E8D8B4;
                font-size:.8rem;
                font-weight:900;
                text-transform:uppercase;
                letter-spacing:.04em;
                margin-bottom:17px;
              }

              h1{
                font-size:clamp(2.35rem,5vw,4.25rem);
                letter-spacing:-.04em;
                line-height:1.05;
                margin:0 0 20px;
              }

              .hero p{
                color:#EDE4D3;
                font-size:1.08rem;
                line-height:1.7;
                max-width:900px;
              }

              .heroPhones{
                width:min(680px,100%);
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:10px;
                margin-top:25px;
              }

              .heroPhone{
                min-height:58px;
                border-radius:12px;
                display:flex;
                flex-direction:column;
                align-items:center;
                justify-content:center;
                font-weight:900;
              }

              .heroFixe{
                background:var(--red);
              }

              .heroPortable{
                background:#fff;
                color:var(--navy);
              }

              /* CONTENU */

              .section{
                padding:65px 0 80px;
                background:
                  linear-gradient(180deg,#fff,#FBF8F1);
              }

              .intro{
                max-width:850px;
                margin-bottom:30px;
                color:var(--muted);
                line-height:1.7;
                font-size:1.02rem;
              }

              .cities{
                display:grid;
                grid-template-columns:
                  repeat(2,minmax(0,1fr));
                gap:20px;
              }

              .cityCard{
                border:1px solid var(--border);
                border-radius:20px;
                background:#fff;
                padding:22px;
                box-shadow:var(--shadow);
              }

              .cityHead{
                display:flex;
                align-items:center;
                gap:13px;
                padding-bottom:17px;
                margin-bottom:15px;
                border-bottom:1px solid var(--border);
              }

              .pin{
                width:48px;
                height:48px;
                border-radius:50%;
                display:grid;
                place-items:center;
                background:#F4EBDD;
                font-size:1.45rem;
              }

              .cityHead h2{
                margin:0 0 4px;
                font-size:1.55rem;
                color:var(--navy);
              }

              .cityHead p{
                margin:0;
                color:var(--muted);
                font-size:.9rem;
              }

              .cityLinks{
                display:grid;
                gap:8px;
              }

              .serviceLink{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:12px;
                min-height:48px;
                border:1px solid var(--border);
                border-radius:11px;
                padding:10px 12px;
                font-weight:800;
                background:#fff;
                transition:.15s ease;
              }

              .serviceLink:hover{
                border-color:var(--gold);
                background:#FBF8F1;
              }

              .serviceLink strong{
                color:var(--red);
              }

              .cityPage{
                margin-top:16px;
                min-height:48px;
                display:flex;
                align-items:center;
                justify-content:center;
                border-radius:11px;
                background:var(--navy);
                color:#fff;
                font-weight:900;
              }

              /* CTA */

              .bottomCta{
                margin-top:38px;
                border-radius:20px;
                background:var(--navy);
                color:#fff;
                padding:28px;
                text-align:center;
              }

              .bottomCta h2{
                margin:0 0 8px;
              }

              .bottomCta p{
                margin:0 0 20px;
                color:#E7E9EC;
              }

              .ctaButtons{
                display:flex;
                justify-content:center;
                flex-wrap:wrap;
                gap:10px;
              }

              .cta{
                padding:13px 18px;
                border-radius:11px;
                font-weight:900;
              }

              .ctaRed{
                background:var(--red);
              }

              .ctaGold{
                background:var(--gold);
                color:var(--navy);
              }

              footer{
                background:var(--navy);
                color:#fff;
                padding:28px 0;
                border-top:3px solid var(--gold);
                text-align:center;
                font-size:.88rem;
              }

              @media(max-width:760px){

                .cities{
                  grid-template-columns:1fr;
                }

                .phonesInner,
                .heroPhones{
                  grid-template-columns:1fr 1fr;
                }

                .phone{
                  font-size:.78rem;
                  padding:5px 3px;
                }

                .heroPhone{
                  font-size:.78rem;
                  min-height:60px;
                  padding:7px 3px;
                }

                .logoBar a{
                  min-height:82px;
                }

                .logoBar img{
                  height:62px;
                }

                .hero{
                  padding:48px 0;
                }

                .section{
                  padding:50px 0 65px;
                }

                .cityCard{
                  padding:17px;
                }

              }

            </style>

          </head>

          <body>

            <div class="phones">
              <div class="phonesInner">

                <a class="phone phoneFixe"
                   href="tel:+33372760060">
                  ☎️ Fixe : 03 72 76 00 60
                </a>

                <a class="phone phonePortable"
                   href="tel:+33601462612">
                  📱 Portable : 06 01 46 26 12
                </a>

              </div>
            </div>

            <div class="logoBar">
              <a href="./"
                 aria-label="Retour à l'accueil J2B Couverture">

                <img
                  src="./logo-temp.png?v=1"
                  alt="J2B Couverture">

              </a>
            </div>

            <main>

              <section class="hero">
                <div class="container">

                  <span class="eyebrow">
                    J2B Couverture • Toul & Nancy
                  </span>

                  <h1>
                    Travaux de toiture
                    <span style="color:#D2B981">
                      par ville
                    </span>
                  </h1>

                  <p>
                    Retrouvez les principales prestations de
                    J2B Couverture à Toul, Nancy et dans le
                    Toulois : rénovation de toiture,
                    réparation de fuite, zinguerie,
                    gouttières, faîtage, démoussage,
                    entretien, isolation et charpente.
                  </p>

                  <div class="heroPhones">

                    <a class="heroPhone heroFixe"
                       href="tel:+33372760060">
                      <span>☎️ Fixe</span>
                      <span>03 72 76 00 60</span>
                    </a>

                    <a class="heroPhone heroPortable"
                       href="tel:+33601462612">
                      <span>📱 Portable</span>
                      <span>06 01 46 26 12</span>
                    </a>

                  </div>

                </div>
              </section>

              <section class="section">

                <div class="container">

                  <p class="intro">
                    Sélectionnez votre ville puis la prestation
                    recherchée. Ces pages permettent de retrouver
                    rapidement les travaux de couverture proposés
                    dans votre secteur.
                  </p>

                  <div class="cities">

          {{CITY_CARDS}}

                  </div>

                  <div class="bottomCta">

                    <h2>Un projet de toiture ?</h2>

                    <p>
                      Contactez directement J2B Couverture
                      ou demandez un devis.
                    </p>

                    <div class="ctaButtons">

                      <a class="cta ctaRed"
                         href="tel:+33372760060">
                        ☎️ 03 72 76 00 60
                      </a>

                      <a class="cta ctaGold"
                         href="./contact.html">
                        📩 Demander un devis
                      </a>

                    </div>

                  </div>

                </div>

              </section>

            </main>

            <footer>
              🛡️ Garantie décennale QBE Europe SA/NV
              • SIRET 851 484 717 00018
              • J2B Couverture
            </footer>

            <script
              src="https://j2b-couverture.fr/ntfy-visites.js?v=1"
              defer>
            </script>

          </body>

          </html>
          '''

          html = html.replace("{{CITY_CARDS}}", city_cards)

          Path("prestations-par-ville.html").write_text(
              html,
              encoding="utf-8"
          )

          # Ajoute le lien dans le menu de la page d'accueil
          index = Path("index.html")

          if index.exists():

              text = index.read_text(encoding="utf-8")

              if "./prestations-par-ville.html" not in text:

                  target = (
                      '<a href="#zone">'
                      '🗺️ Zone d\'intervention</a>'
                  )

                  new_link = (
                      '<a href="./prestations-par-ville.html">'
                      '📍 Prestations par ville</a>\n'
                      '        ' + target
                  )

                  if target in text:
                      text = text.replace(
                          target,
                          new_link,
                          1
                      )

                      index.write_text(
                          text,
                          encoding="utf-8"
                      )

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add prestations-par-ville.html index.html

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Crée la page prestations par ville"
          git push
