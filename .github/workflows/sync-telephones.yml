name: Synchroniser les téléphones J2B Toul

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/sync-telephones.yml"

permissions:
  contents: write

jobs:
  sync-phones:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Synchroniser les téléphones sans toucher à index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          FIXE_TEL = "+33372760060"
          FIXE_TEXT = "03 72 76 00 60"
          PORTABLE_TEL = "+33601462612"
          PORTABLE_TEXT = "06 01 46 26 12"

          START = "<!-- J2B CONTACT GLOBAL START -->"
          END = "<!-- J2B CONTACT GLOBAL END -->"

          BLOCK = f'''
          {START}
          <style id="j2b-contact-global-style">
          .j2b-contact-global{{
            background:#182536;
            color:#fff;
            border-bottom:3px solid #C1A66B;
            position:relative;
            z-index:9999;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
          }}
          .j2b-contact-global-inner{{
            width:min(1180px,94%);
            margin:auto;
            padding:7px 0;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
          }}
          .j2b-contact-global a{{
            min-height:44px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:11px;
            text-decoration:none;
            font-weight:900;
          }}
          .j2b-contact-fixe{{
            background:#B32025;
            color:#fff!important;
          }}
          .j2b-contact-portable{{
            background:#fff;
            color:#182536!important;
          }}
          @media(max-width:650px){{
            .j2b-contact-global-inner{{
              width:100%;
              gap:6px;
              padding:6px;
            }}
            .j2b-contact-global a{{
              font-size:.78rem;
              padding:6px 3px;
              white-space:nowrap;
            }}
          }}
          </style>

          <div class="j2b-contact-global">
            <div class="j2b-contact-global-inner">
              <a class="j2b-contact-fixe" href="tel:{FIXE_TEL}">
                ☎️ Fixe : {FIXE_TEXT}
              </a>
              <a class="j2b-contact-portable" href="tel:{PORTABLE_TEL}">
                📱 Portable : {PORTABLE_TEXT}
              </a>
            </div>
          </div>
          {END}
          '''

          LEGACY_PHONES = re.compile(
              r'''
              \s*
              <div\s+class=["']phones["']\s*>
                  \s*
                  <div\s+class=["']phonesInner["']\s*>
                      .*?
                      <a[^>]*class=["'][^"']*\bphoneFixe\b[^"']*["'][^>]*>.*?</a>
                      .*?
                      <a[^>]*class=["'][^"']*\bphonePortable\b[^"']*["'][^>]*>.*?</a>
                      .*?
                  </div>
                  \s*
              </div>
              \s*
              ''',
              re.I | re.S | re.X
          )

          for path in Path(".").glob("*.html"):

              # L'accueil est géré manuellement :
              # le workflow ne modifie jamais index.html.
              if path.name.lower() == "index.html":
                  continue

              original = path.read_text(encoding="utf-8")
              text = original

              if "<body" not in text.lower():
                  continue

              text = LEGACY_PHONES.sub("\n", text)

              text = re.sub(
                  r'\s*' + re.escape(START) +
                  r'.*?' +
                  re.escape(END) + r'\s*',
                  '\n',
                  text,
                  flags=re.S
              )

              text = re.sub(
                  r'(<body[^>]*>)',
                  r'\1\n' + BLOCK,
                  text,
                  count=1,
                  flags=re.I
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")

      - name: Commit automatique
        run: |
          if git diff --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.html'
          git commit -m "Synchronise les téléphones hors accueil"
          git push
