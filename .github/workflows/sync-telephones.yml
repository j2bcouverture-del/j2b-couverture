name: Synchroniser les téléphones J2B Toul

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/sync-telephones.yml"

permissions:
  contents: write

jobs:
  sync-phones:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ajouter les téléphones sur toutes les pages
        shell: python
        run: |
          from pathlib import Path
          import re

          FIXE_TEL = "+33372760060"
          FIXE_TEXT = "03 72 76 00 60"

          PORTABLE_TEL = "+33601462612"
          PORTABLE_TEXT = "06 01 46 26 12"

          START = "<!-- J2B CONTACT GLOBAL START -->"
          END = "<!-- J2B CONTACT GLOBAL END -->"

          BLOCK = f'''
          {START}
          <style id="j2b-contact-global-style">
            .j2b-contact-global{{
              background:#182536;
              color:#fff;
              font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
              position:relative;
              z-index:9999;
              border-bottom:3px solid #C1A66B;
            }}

            .j2b-contact-global-inner{{
              width:min(1180px,94%);
              margin:auto;
              min-height:52px;
              display:flex;
              align-items:center;
              justify-content:center;
              gap:10px;
              flex-wrap:wrap;
              padding:7px 0;
            }}

            .j2b-contact-global a{{
              display:inline-flex;
              align-items:center;
              justify-content:center;
              min-height:38px;
              padding:8px 14px;
              border-radius:10px;
              text-decoration:none;
              font-weight:900;
            }}

            .j2b-contact-fixe{{
              background:#B32025;
              color:#fff !important;
            }}

            .j2b-contact-portable{{
              background:#fff;
              color:#182536 !important;
            }}

            @media(max-width:650px){{
              .j2b-contact-global-inner{{
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:6px;
                padding:6px;
                width:100%;
              }}

              .j2b-contact-global a{{
                font-size:.78rem;
                padding:8px 5px;
                white-space:nowrap;
              }}
            }}
          </style>

          <div class="j2b-contact-global" aria-label="Téléphones J2B Couverture Toul">
            <div class="j2b-contact-global-inner">
              <a class="j2b-contact-fixe" href="tel:{FIXE_TEL}">
                ☎️ Fixe : {FIXE_TEXT}
              </a>

              <a class="j2b-contact-portable" href="tel:{PORTABLE_TEL}">
                📱 Portable : {PORTABLE_TEXT}
              </a>
            </div>
          </div>
          {END}
          '''

          changed = []

          for path in sorted(Path(".").glob("*.html")):
              text = path.read_text(encoding="utf-8")

              if "<body" not in text.lower():
                  continue

              # Supprime l'ancienne version du bloc s'il existe
              text = re.sub(
                  re.escape(START) + r".*?" + re.escape(END),
                  "",
                  text,
                  flags=re.S
              )

              # Supprime l'ancien header automatique si présent
              text = re.sub(
                  r'<style id="j2b-global-header-style">.*?</style>',
                  "",
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r'<header class="j2b-global-header".*?</header>',
                  "",
                  text,
                  flags=re.S | re.I
              )

              # Ajoute le nouveau bandeau juste après <body>
              text = re.sub(
                  r'(<body[^>]*>)',
                  r'\1\n' + BLOCK,
                  text,
                  count=1,
                  flags=re.I
              )

              path.write_text(text, encoding="utf-8")
              changed.append(path.name)

          print("Pages synchronisées :", len(changed))

      - name: Enregistrer les modifications
        run: |
          if git diff --quiet; then
            echo "Aucune modification nécessaire."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.html'
          git commit -m "Synchronise fixe et portable J2B Toul"
          git push
