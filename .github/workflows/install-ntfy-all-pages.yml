name: Uniformiser ntfy V9 sur toutes les pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-ntfy-all-pages.yml"

permissions:
  contents: write

jobs:
  uniformiser-ntfy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Mettre le même suivi V9 sur toutes les pages
        shell: python
        run: |
          from pathlib import Path
          import re

          SCRIPT_URL = "https://j2b-couverture.fr/ntfy-visites.js?v=9"
          SCRIPT_TAG = f'<script src="{SCRIPT_URL}" defer></script>'

          # Retire n'importe quelle ancienne balise externe ntfy-visites.js
          EXTERNAL_NTFY_RE = re.compile(
              r'<script\b[^>]*src=["\'][^"\']*ntfy-visites\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',
              flags=re.I
          )

          def remove_legacy_index_tracker(text):
              """
              Supprime uniquement l'ancien bloc visiteur V7 intégré à index.html.
              Ne touche pas aux autres scripts utiles de la page.
              """
              marker = "J2B NTFY V7 : NOUVEAU / RETOUR / BOT + GOOGLE ADS"

              pos = text.find(marker)
              if pos == -1:
                  return text, False

              comment_start = text.rfind("<!--", 0, pos)
              script_start = text.find("<script", pos)

              if script_start == -1:
                  return text, False

              script_end = text.find("</script>", script_start)

              if script_end == -1:
                  return text, False

              script_end += len("</script>")

              if comment_start == -1:
                  comment_start = script_start

              new_text = (
                  text[:comment_start].rstrip()
                  + "\n\n"
                  + text[script_end:].lstrip()
              )

              return new_text, True

          changed = []

          for path in sorted(Path(".").rglob("*.html")):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")

              # Ne jamais modifier le fichier spécial de vérification Google.
              if text.lstrip().startswith("google-site-verification:"):
                  continue

              original = text

              # L'accueil pouvait posséder un ancien tracker V7 intégré.
              if path.name == "index.html":
                  text, removed = remove_legacy_index_tracker(text)
                  if removed:
                      print("- Ancien tracker V7 retiré de index.html")

              # Supprime toutes les anciennes inclusions du fichier ntfy,
              # quel que soit leur ancien numéro de version.
              text = EXTERNAL_NTFY_RE.sub("", text)

              # Ajoute exactement UNE inclusion V9 sur chaque vraie page HTML.
              if re.search(r"</body\s*>", text, flags=re.I):
                  text = re.sub(
                      r"</body\s*>",
                      SCRIPT_TAG + "\n</body>",
                      text,
                      count=1,
                      flags=re.I
                  )
              else:
                  text = text.rstrip() + "\n" + SCRIPT_TAG + "\n"

              # Nettoyage léger des lignes vides créées par le remplacement.
              text = re.sub(r"\n{4,}", "\n\n\n", text)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print("")
          print("==========================================")
          print("SUIVI NTFY V9 UNIFORMISÉ")
          print("==========================================")
          print("Script commun :", SCRIPT_URL)
          print("Pages modifiées :", len(changed))

          for name in changed:
              print("-", name)

          print("")
          print("IMPORTANT : ntfy-visites.js n'est PAS réécrit par ce workflow.")
          print("Le fichier V9 que vous avez mis à la racine reste donc intact.")

      - name: Vérifier qu'aucune page n'utilise une ancienne version ntfy
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          expected = 'https://j2b-couverture.fr/ntfy-visites.js?v=9'
          errors = []

          for path in sorted(Path(".").rglob("*.html")):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")

              if text.lstrip().startswith("google-site-verification:"):
                  continue

              count = len(
                  re.findall(
                      r'<script\b[^>]*src=["\'][^"\']*ntfy-visites\.js[^"\']*["\'][^>]*>\s*</script>',
                      text,
                      flags=re.I
                  )
              )

              if count != 1:
                  errors.append(
                      f"{path}: {count} inclusion(s) ntfy-visites.js"
                  )

              if expected not in text:
                  errors.append(
                      f"{path}: la version V9 attendue est absente"
                  )

          if errors:
              print("ERREURS :")
              for error in errors:
                  print("-", error)
              sys.exit(1)

          print("OK : toutes les pages utilisent exactement une fois ntfy V9.")

      - name: Commit automatique
        run: |
          if git diff --quiet; then
            echo "Aucune modification nécessaire."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.html'
          git add '**/*.html' 2>/dev/null || true

          git commit -m "Uniformiser le suivi ntfy V9 sur toutes les pages"
          git push
