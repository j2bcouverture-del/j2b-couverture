name: Add J2B global header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-j2b-global-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add header to all visitor HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          HEADER = '''<header class="j2b-global-header" aria-label="En-tête J2B Couverture">
            <div class="j2b-global-header-inner">
              <a class="j2b-global-brand" href="./" aria-label="J2B Couverture - Accueil">
                <img src="./logo-temp.png?v=1" alt="J2B Couverture - Couvreur à Toul">
              </a>
              <nav class="j2b-global-nav" aria-label="Navigation principale">
                <a class="j2b-home-link" href="./">Accueil</a>
                <a class="j2b-phone-link" href="tel:+33601462612">📞 06 01 46 26 12</a>
              </nav>
            </div>
          </header>'''

          STYLE = '''<style id="j2b-global-header-style">
          .j2b-global-header{background:#fff;border-bottom:4px solid #C1A66B;position:relative;z-index:1000;box-shadow:0 6px 20px rgba(24,37,54,.08)}
          .j2b-global-header *{box-sizing:border-box}
          .j2b-global-header-inner{width:min(1160px,92%);min-height:82px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0}
          .j2b-global-brand{display:flex;align-items:center;flex:0 0 auto}
          .j2b-global-brand img{display:block;width:auto;height:62px;max-width:210px;object-fit:contain}
          .j2b-global-nav{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
          .j2b-global-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:11px;text-decoration:none;font-weight:900;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
          .j2b-home-link{color:#182536;background:#F7F5F1;border:1px solid #E1E3E5}
          .j2b-phone-link{color:#fff!important;background:#B32025;border:1px solid #B32025}
          @media(max-width:620px){
            .j2b-global-header-inner{min-height:76px;width:94%;padding:7px 0;gap:8px}
            .j2b-global-brand img{height:54px;max-width:160px}
            .j2b-global-nav{gap:6px;flex-wrap:nowrap}
            .j2b-global-nav a{min-height:40px;padding:8px 10px;font-size:.78rem}
            .j2b-home-link{display:none!important}
            .j2b-phone-link{white-space:nowrap}
          }
          </style>'''

          changed = []

          for path in sorted(Path('.').glob('*.html')):
              if path.name == 'index.html':
                  continue

              text = path.read_text(encoding='utf-8')

              if '<body' not in text.lower():
                  continue

              if 'j2b-global-header' in text:
                  continue

              if '</head>' not in text.lower():
                  continue

              text = re.sub(
                  r'</head>',
                  STYLE + '\n</head>',
                  text,
                  count=1,
                  flags=re.I
              )

              text = re.sub(
                  r'(<body[^>]*>)',
                  r'\1\n' + HEADER + '\n',
                  text,
                  count=1,
                  flags=re.I
              )

              path.write_text(text, encoding='utf-8')
              changed.append(path.name)

          print("Pages modifiées :", len(changed))
          for name in changed:
              print("-", name)

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Aucune modification nécessaire."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.html'
          git commit -m "Add J2B logo header to all pages"
          git push
